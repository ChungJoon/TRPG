<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ようこそ</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #1a202c;
        }
        .shiny-silver-text {
            background: linear-gradient(45deg, #e0e0e0, #ffffff, #b0b0b0, #d0d0d0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container mx-auto px-4 py-8 text-center text-white">
        <div class="max-w-3xl mx-auto mt-12">
            <h1 class="text-5xl font-bold text-yellow-300 mb-4 shiny-silver-text">TRPGセッション支援ツール</h1>
            <p class="text-xl text-gray-300 mb-8">
                キャラクター管理、戦闘シミュレーション、コマンド実行など、あなたのTRPGセッションを総合的にサポートします。
            </p>
            <div class="bg-gray-800 p-10 rounded-lg shadow-lg border border-gray-700">
                <h2 class="text-3xl font-semibold text-white mb-6">ログイン / 新規登録</h2>
                <form method="POST" action="{{ url_for('handle_login') }}" class="space-y-6">
                    <div>
                        <label for="id" class="block text-lg font-medium text-gray-300 text-left mb-2">ユーザーID:</label>
                        <input type="text" id="id" name="id" required
                               class="w-full p-3 rounded-md bg-gray-700 border border-gray-600 text-white focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label for="pwd" class="block text-lg font-medium text-gray-300 text-left mb-2">パスワード:</label>
                        <input type="password" id="pwd" name="pwd" required
                               class="w-full p-3 rounded-md bg-gray-700 border border-gray-600 text-white focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div class="flex justify-between space-x-4">
                        <button type="submit" name="action" value="login"
                                class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-md transition duration-300 ease-in-out transform hover:scale-105">
                            ログイン
                        </button>
                        <button type="submit" name="action" value="register"
                                class="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-md transition duration-300 ease-in-out transform hover:scale-105">
                            パスワード登録
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
